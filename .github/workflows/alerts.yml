name: Starter injury alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email for the next game right now"
        type: boolean
        default: false
      team:
        description: "Test only: team to report on, e.g. OKC or Thunder (blank = next game)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check games and email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_TIMEZONE: ${{ vars.ALERT_TIMEZONE }}
          ALWAYS_EMAIL: ${{ vars.ALWAYS_EMAIL }}
          TEST_TEAM: ${{ inputs.team }}
        run: python alerts.py ${{ inputs.test && '--test' || '' }}
      - name: Remember which games were alerted
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Record alerted games"
          git pull --rebase origin main
          git push
